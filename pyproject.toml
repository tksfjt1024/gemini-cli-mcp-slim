[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-cli-mcp-slim"
version = "0.1.1"
description = "A thin, auditable MCP server wrapping the Gemini CLI. Forward-compatible with future CLI flags via extra_args passthrough."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "tksfjt1024", email = "tksfjt1024@gmail.com" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "gemini",
    "gemini-cli",
    "claude",
    "anthropic",
    "ai",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
dev = [
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/tksfjt1024/gemini-cli-mcp-slim"
Repository = "https://github.com/tksfjt1024/gemini-cli-mcp-slim"
Issues = "https://github.com/tksfjt1024/gemini-cli-mcp-slim/issues"

[project.scripts]
gemini-cli-mcp-slim = "gemini_cli_mcp_slim.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
